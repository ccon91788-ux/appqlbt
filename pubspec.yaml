name: lifesync
description: LifeSync - Lịch, nhắc nhở và quản lý tài chính cá nhân (offline).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  fl_chart: ^0.70.2
  file_picker: ^8.3.7
  share_plus: ^12.0.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/stickers/
